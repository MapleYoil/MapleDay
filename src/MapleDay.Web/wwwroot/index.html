<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="color-scheme" content="light dark"><title>메요일 · 웹</title><link rel="stylesheet" href="/style.css"><script src="/app.js" defer></script></head>
<body>
<a class="skip" href="#main">본문으로 이동</a>
<section id="login" class="login"><div class="login-card"><div class="brandmark" aria-hidden="true">M</div><p class="eyebrow">MAPLEDAY WEB</p><h1>어디서든, 내 메요일.</h1><p class="muted">실행 중인 메요일에 연결해<br>캐릭터의 오늘과 이번 주를 확인하세요.</p><form id="login-form"><label for="password">웹 접속 비밀번호</label><input id="password" type="password" autocomplete="current-password" required minlength="8" maxlength="256"><button class="primary" type="submit">접속하기 <span aria-hidden="true">→</span></button><p id="login-error" role="status"></p></form><p class="small muted">비밀번호는 PC 앱의 설정 → 웹에서 보기에서 지정합니다.</p></div></section>
<div id="app" hidden>
<header><div class="brand"><div class="brandmark" aria-hidden="true">M</div><span>메요일 <small>WEB</small></span></div><div class="header-actions"><span id="connection" role="status">연결 중</span><button id="refresh" title="표시 데이터 다시 가져오기">새로고침</button><button id="theme" aria-label="화면 모드 전환">다크 모드</button><button id="logout">로그아웃</button></div></header>
<div class="shell"><nav aria-label="주 메뉴"><button data-page="scheduler" class="active" aria-current="page"><span aria-hidden="true">▦</span> 스케줄러</button><button data-page="income"><span aria-hidden="true">↗</span> 수익</button><button data-page="level"><span aria-hidden="true">↑</span> 레벨</button><p class="small muted">PC 앱이 갱신한 정보를<br>조회하는 화면입니다.</p></nav>
<main id="main"><div class="page-heading"><div><p class="eyebrow" id="eyebrow">YOUR MAPLE DAYS</p><h1 id="title">스케줄러</h1></div><p id="updated" class="small muted"></p></div><section id="characters" class="characters" aria-label="캐릭터 선택"></section><p id="notice" class="notice" role="status" hidden></p><section id="view" aria-label="스케줄러"></section><footer><span>Data based on NEXON Open API · <a href="/font-license.txt">Pretendard 라이선스</a></span><span id="version"></span></footer></main></div>
</div>
<dialog id="day-dialog"><div class="dialog-head"><h2 id="day-title"></h2><button id="close-dialog" aria-label="닫기">닫기</button></div><div id="day-records"></div></dialog>
</body></html>
